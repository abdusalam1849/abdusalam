<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新疆求职通 · 预览</title>
<style>
:root{
  --primary:#1e90ff; --primary-dark:#0f7adf; --bg:#f5f7fa;
  --text:#1a1a1a; --muted:#8a8f99; --line:#f0f2f5; --danger:#ff5722;
  --card:#fff; --tag-bg:#e6f1ff;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',Helvetica,Arial,sans-serif;background:#e9eef5;color:var(--text)}
#app{max-width:480px;margin:0 auto;background:var(--bg);min-height:100vh;position:relative;padding-bottom:84px;box-shadow:0 0 40px rgba(0,0,0,.08)}
/* 顶部导航 */
.topbar{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:48px 18px 16px;position:sticky;top:0;z-index:20}
.topbar h1{font-size:18px;font-weight:600}
.topbar .sub{font-size:12px;opacity:.85;margin-top:3px}
/* 底部 Tab */
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.tabbar .tab{flex:1;text-align:center;padding:8px 0 6px;color:var(--muted);font-size:11px;cursor:pointer;transition:.2s}
.tabbar .tab.active{color:var(--primary)}
.tabbar .tab .ic{font-size:20px;display:block;line-height:1.2}
/* 通用 */
.view{display:none}.view.active{display:block}
.section{background:#fff;margin:10px 12px;border-radius:12px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.04)}
.section .h{font-size:15px;font-weight:600;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.section .h .more{font-size:12px;color:var(--primary);font-weight:400}
.muted{color:var(--muted);font-size:12px}
/* 卡片列表 */
.job-list .card{background:#fff;border-radius:12px;padding:14px;margin:8px 12px;box-shadow:0 1px 6px rgba(0,0,0,.04);cursor:pointer;transition:.1s}
.job-list .card:active{transform:scale(.98)}
.jh{display:flex;justify-content:space-between;align-items:flex-start}
.jh .t{font-size:16px;font-weight:600;flex:1;margin-right:10px}
.jh .s{font-size:15px;color:var(--danger);font-weight:600;white-space:nowrap}
.jc{color:#4a4a4a;font-size:13px;margin:6px 0}
.jm{color:var(--muted);font-size:12px}
.tags{margin-top:7px}
.tag{display:inline-block;padding:2px 8px;margin:2px 5px 0 0;font-size:11px;color:var(--primary);background:var(--tag-bg);border-radius:10px}
.jf{display:flex;justify-content:space-between;align-items:center;margin-top:9px}
.badge{font-size:10px;color:#fff;background:var(--primary);padding:1px 7px;border-radius:8px}
.empty{text-align:center;color:var(--muted);padding:50px 0;font-size:13px}
.loading{text-align:center;color:var(--muted);padding:30px 0}
/* 分类标签栏 */
.tabs{display:flex;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:15}
.tabs .ct{padding:12px 16px;font-size:14px;color:var(--muted);white-space:nowrap;cursor:pointer;position:relative}
.tabs .ct.active{color:var(--primary);font-weight:600}
.tabs .ct.active::after{content:'';position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:20px;height:3px;background:var(--primary);border-radius:2px}
/* 状态条 */
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:#fff;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.refresh-tip{color:var(--primary);cursor:pointer}
/* 搜索框 */
.searchbar{display:flex;padding:10px 12px;background:#fff;gap:8px;border-bottom:1px solid var(--line)}
.searchbar input{flex:1;border:none;background:var(--bg);border-radius:8px;padding:9px 12px;font-size:14px;outline:none}
.searchbar button{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:0 16px;font-size:14px}
/* 筛选面板 */
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px 0}
.filter-grid .f{background:var(--bg);border-radius:8px;padding:10px 12px}
.filter-grid .f .lbl{font-size:12px;color:var(--muted);margin-bottom:6px}
.filter-grid .f .opts{display:flex;flex-wrap:wrap;gap:6px}
.filter-grid .f .opt{padding:4px 10px;font-size:12px;border-radius:12px;background:#fff;border:1px solid var(--line);cursor:pointer}
.filter-grid .f .opt.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0}
.chips .chip{padding:6px 14px;font-size:13px;border-radius:16px;background:var(--bg);cursor:pointer;border:1px solid var(--line)}
.chips .chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* 统计卡 */
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stat-grid .sc{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;border-radius:12px;padding:14px 10px;text-align:center}
.stat-grid .sc .n{font-size:22px;font-weight:700}
.stat-grid .sc .l{font-size:11px;opacity:.9;margin-top:3px}
.stat-grid .sc.alt{background:linear-gradient(135deg,#ff9800,#f57c00)}
.stat-grid .sc.alt2{background:linear-gradient(135deg,#43c59d,#2a9d8f)}
.stat-grid .sc.alt3{background:linear-gradient(135deg,#9c27b0,#6a1b9a)}
/* 图表 */
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:140px;padding:24px 8px 8px}
.bar-chart .bar{flex:1;background:linear-gradient(180deg,var(--primary),#7fc4ff);border-radius:4px 4px 0 0;min-height:3px;position:relative;cursor:pointer}
.bar-chart .bar:hover{background:var(--primary-dark)}
.bar-chart .bar .v{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text)}
.bar-chart .xl{font-size:9px;color:var(--muted);text-align:center;margin-top:4px;transform:rotate(-30deg);transform-origin:top;white-space:nowrap}
.hbar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px}
.hbar .name{width:64px;text-align:right;color:#4a4a4a}
.hbar .track{flex:1;background:var(--bg);border-radius:8px;height:18px;overflow:hidden}
.hbar .fill{height:100%;background:linear-gradient(90deg,var(--primary),#7fc4ff);border-radius:8px;transition:.4s}
.hbar .val{width:36px;font-size:12px;color:var(--muted)}
.donut-wrap{display:flex;align-items:center;justify-content:center;gap:20px}
.legend{font-size:12px}
.legend .li{display:flex;align-items:center;gap:6px;margin:4px 0}
.legend .dot{width:10px;height:10px;border-radius:2px}
/* 资讯 */
.news-item{padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.news-item:last-child{border:none}
.news-item .nt{font-size:14px;font-weight:500;line-height:1.5}
.news-item .nm{color:var(--muted);font-size:12px;margin-top:6px;display:flex;justify-content:space-between}
/* 我的 */
.me-header{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;padding:40px 18px 24px;text-align:center}
.avatar{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.25);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:28px}
.menu-item{display:flex;align-items:center;justify-content:space-between;padding:14px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.menu-item:last-child{border:none}
.menu-item .ml{display:flex;align-items:center;gap:10px}
.menu-item .ic{font-size:20px;color:var(--primary)}
.menu-item .tx{font-size:14px}
.menu-item .ar{color:var(--muted)}
.menu-item .val{color:var(--muted);font-size:12px}
/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
.modal-mask.show{display:flex}
.modal{background:#fff;width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:85vh;overflow-y:auto}
.modal h2{font-size:18px;margin-bottom:4px}
.modal .s{font-size:16px;color:var(--danger);font-weight:600}
.modal .company{color:var(--primary);font-size:14px;margin:8px 0}
.modal .meta{color:var(--muted);font-size:13px;line-height:1.8}
.modal .st{font-size:15px;font-weight:600;margin:16px 0 8px}
.modal .desc{font-size:14px;color:#2a2a2a;line-height:1.8;white-space:pre-wrap}
.modal .line{font-size:14px;color:#2a2a2a;padding:4px 0}
.modal .actions{margin-top:18px;display:flex;gap:10px}
.modal .btn{flex:1;background:var(--primary);color:#fff;border:none;border-radius:24px;padding:12px 0;font-size:14px;cursor:pointer}
.modal .btn.outline{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.modal .close{float:right;font-size:24px;color:var(--muted);cursor:pointer;line-height:1}
.float-btn{position:fixed;right:20px;bottom:80px;width:48px;height:48px;border-radius:50%;background:var(--primary);color:#fff;border:none;font-size:22px;box-shadow:0 4px 16px rgba(30,144,255,.4);cursor:pointer;z-index:40;display:none}
.float-btn.show{display:block}
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><h1>新疆求职通</h1><div class="sub" id="topSub">疆内岗位每日实时更新</div></div>
  <div id="content"></div>
  <div class="tabbar">
    <div class="tab active" data-v="jobs" onclick="switchView('jobs')"><span class="ic">📋</span>岗位</div>
    <div class="tab" data-v="filter" onclick="switchView('filter')"><span class="ic">🔍</span>筛选</div>
    <div class="tab" data-v="board" onclick="switchView('board')"><span class="ic">📊</span>看板</div>
    <div class="tab" data-v="news" onclick="switchView('news')"><span class="ic">📰</span>资讯</div>
    <div class="tab" data-v="me" onclick="switchView('me')"><span class="ic">👤</span>我的</div>
  </div>
</div>
<div class="modal-mask" id="modal"><div class="modal" id="modalBody"></div></div>
<button class="float-btn" id="floatBtn" onclick="scrollTop()">↑</button>

</body>
</html>
