<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>新疆求职通 · 预览</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', Helvetica, Arial, sans-serif;
    background: #f5f7fa; color: #1a1a1a; max-width: 480px; margin: 0 auto;
    min-height: 100vh; padding-bottom: 40px;
  }
  .phone {
    background: #fff; min-height: 100vh; box-shadow: 0 0 40px rgba(0,0,0,0.08);
    position: relative;
  }
  .nav {
    background: linear-gradient(135deg, #1e90ff, #0f7adf); color: #fff;
    padding: 56px 20px 18px; position: sticky; top: 0; z-index: 10;
  }
  .nav h1 { font-size: 18px; font-weight: 600; }
  .nav .sub { font-size: 12px; opacity: 0.85; margin-top: 4px; }
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 16px; background: #fff; border-bottom: 1px solid #f0f2f5;
    font-size: 12px; color: #8a8f99;
  }
  .refresh-tip { color: #1e90ff; }
  .filter-bar {
    display: flex; justify-content: space-around; padding: 14px 0;
    background: #fff; border-bottom: 8px solid #f5f7fa;
  }
  .filter-item { font-size: 14px; color: #1a1a1a; }
  .search-box {
    display: flex; padding: 12px 16px; background: #fff;
    border-bottom: 1px solid #f0f2f5; gap: 10px;
  }
  .search-box input {
    flex: 1; border: none; background: #f5f7fa; border-radius: 8px;
    padding: 10px 14px; font-size: 14px; outline: none;
  }
  .search-box button {
    background: #1e90ff; color: #fff; border: none; border-radius: 8px;
    padding: 0 18px; font-size: 14px;
  }
  .list { padding: 12px 16px; }
  .job-card {
    background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04); cursor: pointer;
    transition: transform 0.1s;
  }
  .job-card:active { transform: scale(0.98); }
  .job-header { display: flex; justify-content: space-between; align-items: flex-start; }
  .job-title { font-size: 16px; font-weight: 600; flex: 1; margin-right: 10px; }
  .salary { font-size: 15px; color: #ff5722; font-weight: 600; white-space: nowrap; }
  .job-company { color: #4a4a4a; font-size: 13px; margin: 6px 0; }
  .job-meta { color: #8a8f99; font-size: 12px; }
  .tags { margin-top: 8px; }
  .tag {
    display: inline-block; padding: 2px 8px; margin: 2px 6px 0 0;
    font-size: 11px; color: #1e90ff; background: #e6f1ff; border-radius: 10px;
  }
  .job-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .source-badge {
    font-size: 10px; color: #fff; background: #1e90ff;
    padding: 1px 8px; border-radius: 8px;
  }
  .footer { text-align: center; color: #8a8f99; padding: 14px 0; font-size: 12px; }
  .empty { text-align: center; color: #8a8f99; padding: 60px 0; }
  .loading { text-align: center; color: #8a8f99; padding: 30px 0; }
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100;
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff; width: 100%; max-width: 480px; border-radius: 16px 16px 0 0;
    padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
    max-height: 80vh; overflow-y: auto;
  }
  .modal h2 { font-size: 18px; margin-bottom: 6px; }
  .modal .salary { font-size: 18px; }
  .modal .company { color: #1e90ff; font-size: 15px; margin: 10px 0; }
  .modal .meta { color: #8a8f99; font-size: 13px; line-height: 1.8; }
  .modal .section-title { font-size: 15px; font-weight: 600; margin: 18px 0 10px; }
  .modal .desc { font-size: 14px; color: #2a2a2a; line-height: 1.8; white-space: pre-wrap; }
  .modal .line { font-size: 14px; color: #2a2a2a; padding: 4px 0; }
  .modal .actions { margin-top: 20px; display: flex; gap: 12px; }
  .modal .btn {
    flex: 1; background: #1e90ff; color: #fff; border: none; border-radius: 24px;
    padding: 12px 0; font-size: 14px; cursor: pointer;
  }
  .modal .btn.outline { background: #fff; color: #1e90ff; border: 1px solid #1e90ff; }
  .modal .close { position: sticky; top: 0; float: right; font-size: 22px; color: #8a8f99; cursor: pointer; }
  .float-btn {
    position: fixed; right: 20px; bottom: 24px; width: 48px; height: 48px;
    border-radius: 50%; background: #1e90ff; color: #fff; border: none;
    font-size: 20px; box-shadow: 0 4px 16px rgba(30,144,255,0.4); cursor: pointer; z-index: 50;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="nav">
    <h1>新疆求职通</h1>
    <div class="sub">疆内岗位每日实时更新</div>
  </div>

  <div class="search-box">
    <input id="keyword" type="text" placeholder="职位/公司/关键词">
    <button onclick="search()">搜索</button>
  </div>

  <div class="status-bar">
    <span id="lastUpdate">加载中...</span>
    <span class="refresh-tip" onclick="refresh()">↓ 下拉刷新</span>
  </div>

  <div class="filter-bar">
    <span class="filter-item" onclick="alert('小程序端可选城市，预览版已默认全疆')">城市</span>
    <span class="filter-item" onclick="alert('小程序端可选全职/兼职/实习')">类型</span>
    <span class="filter-item" onclick="alert('小程序端可选薪资范围')">薪资</span>
  </div>

  <div id="list" class="list">
    <div class="loading">加载中...</div>
  </div>
  <div id="footer" class="footer" style="display:none"></div>
</div>

<div class="modal-mask" id="modal">
  <div class="modal" id="modalBody"></div>
</div>

<button class="float-btn" onclick="refresh()">↻</button>

<script>
const API = '';  // 同源
let lastList = [];
const PAGE_SIZE = 50;

function fmtTime(ts) {
  if (!ts) return '未知';
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function ago(ts) {
  if (!ts) return '';
  const diff = Date.now() - ts;
  const m = Math.floor(diff / 60000);
  if (m < 1) return '刚刚';
  if (m < 60) return `${m} 分钟前`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h} 小时前`;
  const d = Math.floor(h / 24);
  if (d < 30) return `${d} 天前`;
  return new Date(ts).toLocaleDateString('zh-CN');
}

async function fetchList(params = {}) {
  const q = new URLSearchParams();
  Object.keys(params).forEach(k => { if (params[k] !== '' && params[k] != null) q.set(k, params[k]); });
  q.set('pageSize', PAGE_SIZE);
  const url = API + '/api/jobs/list?' + q.toString();
  const res = await fetch(url);
  const json = await res.json();
  return json.data;
}

async function search() {
  const keyword = document.getElementById('keyword').value.trim();
  await load({ keyword });
}

async function refresh() {
  await load({});
}

async function load(params) {
  const listEl = document.getElementById('list');
  listEl.innerHTML = '<div class="loading">加载中...</div>';
  try {
    const data = await fetchList(params);
    lastList = data.list;
    document.getElementById('lastUpdate').textContent = '更新于 ' + fmtTime(data.lastUpdateAt);
    render(data.list, data.total);
  } catch (e) {
    listEl.innerHTML = '<div class="empty">加载失败：' + (e.message || '服务不可达') + '<br><br>请确认后端服务已启动</div>';
  }
}

function render(list, total) {
  const listEl = document.getElementById('list');
  const footerEl = document.getElementById('footer');
  if (!list.length) {
    listEl.innerHTML = '<div class="empty">暂无匹配岗位</div>';
    footerEl.style.display = 'none';
    return;
  }
  listEl.innerHTML = list.map(j => `
    <div class="job-card" onclick="openDetail(${j.id})">
      <div class="job-header">
        <div class="job-title">${escape(j.title)}</div>
        <div class="salary">${escape(j.salary || '面议')}</div>
      </div>
      <div class="job-company">${escape(j.company)}</div>
      <div class="job-meta">
        ${escape(j.city)}${j.district ? ' · ' + escape(j.district) : ''} · ${escape(j.experience || '不限')} · ${escape(j.education || '不限')}
      </div>
      <div class="tags">${(j.welfare || []).map(w => `<span class="tag">${escape(w)}</span>`).join('')}</div>
      <div class="job-footer">
        <span style="color:#8a8f99;font-size:12px">${ago(j.created_at)}</span>
        <span class="source-badge">${escape(j.source)}</span>
      </div>
    </div>
  `).join('');
  footerEl.style.display = 'block';
  footerEl.textContent = `共 ${total} 条岗位，实时数据来自后端 API`;
}

async function openDetail(id) {
  const mask = document.getElementById('modal');
  const body = document.getElementById('modalBody');
  body.innerHTML = '<div style="text-align:center;padding:40px">加载中...</div>';
  mask.classList.add('show');
  try {
    const res = await fetch(API + '/api/jobs/' + id);
    const json = await res.json();
    const j = json.data;
    body.innerHTML = `
      <span class="close" onclick="closeModal()">×</span>
      <h2>${escape(j.title)}</h2>
      <div class="salary">${escape(j.salary || '面议')}</div>
      <div class="company">${escape(j.company)}</div>
      <div class="meta">
        ${escape(j.city)}${j.district ? ' · ' + escape(j.district) : ''}<br>
        经验：${escape(j.experience || '不限')} · 学历：${escape(j.education || '不限')}<br>
        类型：${escape(j.job_type || '全职')} · 发布：${escape(j.publish_time || '实时')}
      </div>
      <div class="section-title">福利</div>
      <div class="tags">${(j.welfare || []).map(w => `<span class="tag">${escape(w)}</span>`).join('') || '<span style="color:#8a8f99">—</span>'}</div>
      <div class="section-title">职位描述</div>
      <div class="desc">${escape(j.description || '—')}</div>
      <div class="section-title">联系方式</div>
      ${j.contact ? `<div class="line">联系人：${escape(j.contact)}</div>` : ''}
      ${j.phone ? `<div class="line">电话：${escape(j.phone)}</div>` : ''}
      ${j.email ? `<div class="line">邮箱：${escape(j.email)}</div>` : ''}
      ${j.address ? `<div class="line">地址：${escape(j.address)}</div>` : ''}
      ${!j.contact && !j.phone && !j.email && !j.address ? '<div class="line" style="color:#8a8f99">未提供联系方式</div>' : ''}
      <div class="actions">
        <button class="btn" onclick="copyText('${escape(j.phone || '')}')">复制电话</button>
        <button class="btn outline" onclick="copyText('${escape(j.url || '')}')">复制原文链接</button>
      </div>
    `;
  } catch (e) {
    body.innerHTML = '<div class="empty">加载失败</div>';
  }
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}
function copyText(t) {
  if (!t) return alert('无内容');
  navigator.clipboard.writeText(t).then(() => alert('已复制'));
}
function escape(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});
document.getElementById('keyword').addEventListener('keydown', e => {
  if (e.key === 'Enter') search();
});

load({});
</script>
</body>
</html>
