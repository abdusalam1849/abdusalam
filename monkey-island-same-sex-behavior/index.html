<script id="post-data" type="application/json">
{
  "title": "猴子岛上，72%的雄猴有同性行为——它们还生了更多后代",
  "account": "TraeWork",
  "account_sub": "",
  "author": "TraeWork",
  "date": "2026年10月13日 18:05",
  "location": "北京",
  "is_original": true,
  "body_html": "<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">在加勒比海的一座小岛上，科学家蹲了三年，数猴子。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">数出来的结果，把演化生物学里一个争论了几十年的悖论，又往前推了一步。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">先看数据，别着急下结论：</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">01</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">猴子岛</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">波多黎各东海岸，有座小岛叫 Cayo Santiago，当地人叫它\"猴子岛\"。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">1938 年，美国灵长类学家 Clarence Ray Carpenter 从印度 Lucknow 运了 409 只恒河猴，经 40 天海运到纽约，再转运到波多黎各，最后放养在这座与世隔绝的小岛上。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">岛很小，只有 15.2 公顷，大概 21 个足球场那么大。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">Carpenter 的想法很朴素——野外观察灵长类干扰太多，如果找一个封闭的自然环境，让猴子自由生活，研究者从旁观察，能干净得多。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">从 1956 年起，岛上每一只新生猴子都会被采血、做基因分型。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">这意味着，岛上几乎每一只猴子的父母是谁、祖父母是谁、属于哪个家族谱系，全都有记录。家谱延续了将近 70 年，覆盖了好几个猴代。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">如今岛上的猴子，全都是 1938 年那 409 只创始个体的直系后代，几乎每一只都有据可查。</p>\n\n<p style=\"background:#f0f4f8;border-left:4px solid #0a84ff;padding:14px 18px;margin:30px 0;font-size:15px;color:#444;line-height:1.8;\">这座岛从此成了研究灵长类行为遗传学的\"天然实验室\"——不仅能观察行为，还能追溯这些行为的遗传基础。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">02</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">72% 对 46%</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">伦敦帝国理工学院的 Vincent Savolainen 团队，在这里蹲了三年。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">他的博士生 Jackson Clive 负责野外观察。Clive 后来在采访里说：</p>\n\n<blockquote style=\"margin:20px 0;padding:14px 18px;background:#f9f9f9;border-left:4px solid #0a84ff;font-size:15px;color:#555;line-height:1.8;\">\"行为观察极其考验耐心——你必须长时间坐在那里盯着看，同时保持高度警觉，因为性行为发生得很不规律，稍不留神就会错过。\"</blockquote>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">更难的是，一个社群里有 120 只雄猴，你得一只一只认出来，记住每一只有什么面部特征和体态差异。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">他们记录了 <strong>236 只雄性恒河猴的所有爬跨行为</strong>，包括雄性与雄性的，也包括雄性与雌性的。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">结果出来了：</p>\n\n<p style=\"text-align:center;margin:30px 0;\">\n<svg width=\"100%\" height=\"260\" viewBox=\"0 0 360 260\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:360px;\">\n  <text x=\"180\" y=\"24\" text-anchor=\"middle\" font-size=\"14\" fill=\"#2b2b2b\" font-weight=\"bold\">雄性恒河猴爬跨行为比例</text>\n  <rect x=\"60\" y=\"60\" width=\"100\" height=\"144\" fill=\"#4a90d9\" rx=\"4\"/>\n  <text x=\"110\" y=\"140\" text-anchor=\"middle\" font-size=\"32\" fill=\"#fff\" font-weight=\"bold\">72%</text>\n  <text x=\"110\" y=\"220\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2b2b2b\">同性爬跨</text>\n  <rect x=\"200\" y=\"110\" width=\"100\" height=\"94\" fill=\"#e07a5f\" rx=\"4\"/>\n  <text x=\"250\" y=\"165\" text-anchor=\"middle\" font-size=\"32\" fill=\"#fff\" font-weight=\"bold\">46%</text>\n  <text x=\"250\" y=\"220\" text-anchor=\"middle\" font-size=\"13\" fill=\"#2b2b2b\">异性爬跨</text>\n</svg>\n</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\"><strong style=\"color:#c0392b;\">72% 的雄性有过同性爬跨行为，只有 46% 有过与雌性的爬跨行为。</strong></p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">同性性行为的比例，比异性还高。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">而且同性性行为的可重复性达到了 19.35%——可重复性是行为学里的关键指标，说明这不是偶然发生的。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">03</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">达尔文悖论</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">这个结果直接挑战了演化生物学里一个争论了很多年的观点——\"达尔文悖论\"。</p>\n\n<p style=\"background:#f0f4f8;border-left:4px solid #0a84ff;padding:14px 18px;margin:20px 0;font-size:15px;color:#444;line-height:1.8;\">传统观点认为：自然选择应该淘汰那些不利于繁殖的行为。同性性行为不能直接产生后代，按照这个逻辑，携带相关基因的个体应该在演化中逐渐消失。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">但事实是：它非但没有消失，反而在种群里广泛存在。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">更反常的还在后面。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">此前大家普遍认为：同性性行为越多，后代应该越少。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">但观察结果完全相反——</p>\n\n<p style=\"text-align:center;font-size:18px;font-weight:bold;color:#c0392b;line-height:1.6;margin:30px 0;padding:0 20px;\">那些对其他雄性发生更多同性性行为的雄猴，反而生下了更多后代。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">04</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">为什么旧解释站不住</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">长期以来，科学界对动物同性性行为有过各种解释，但很多都站不住脚。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\"><strong>说法一：关在动物园里无聊了才干这事。</strong></p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">但猴子岛的恒河猴是在自然环境里自由生活的，这个解释说不通。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\"><strong>说法二：这是确立等级地位的支配行为。</strong></p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">高地位个体爬跨低地位个体，只是为了展示权力，跟性本身无关。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">但数据不支持：Clive 团队发现，爬跨行为中\"主动方\"和\"被动方\"之间存在正遗传相关——也就是说，做\"主动方\"多的个体，做\"被动方\"也多。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">如果纯粹是支配行为，高等级个体应该只做主动方，不会反过来。实际情况不是这样。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\"><strong>说法三：年轻个体在为将来的异性交配做练习。</strong></p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">这个假说有一定合理性，但它无法解释为什么成年猴子——已经有过多次异性交配经验的个体——依然频繁地进行同性性行为。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">05</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">真正的答案</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">研究者给出的结论是：雄性之间的性行为，是为了强化\"联盟关系\"。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">先搞清楚\"联盟关系\"在恒河猴社会里意味着什么。</p>\n\n<p style=\"background:#f0f4f8;border-left:4px solid #0a84ff;padding:14px 18px;margin:20px 0;font-size:15px;color:#444;line-height:1.8;\">恒河猴群体有严格的等级制度，雄猴之间的竞争非常激烈。一只雄猴的社会地位，直接决定了它能接触到多少雌猴、获得多少交配机会。但单打独斗在这套等级体系里很难出头。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">更有效的策略是——结盟。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">恒河猴的联盟不是必然的。两只雄猴要形成稳定的联盟关系，需要一定的信任基础。理毛是维护关系的一种方式，但性接触，能让关系更加牢固。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">数据证实了这一点：</p>\n\n<p style=\"background:#fff8e1;border-left:4px solid #f5a623;padding:14px 18px;margin:20px 0;font-size:15px;color:#5a4a1a;line-height:1.8;\">同性性行为与联盟行为之间存在显著的统计关联，而且这一关联在控制了年龄、群体结构等人口学因素之后依然成立。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">换句话说：今天我跟你有过性接触，明天打架的时候，你更可能站在我这边。</p>\n\n<p style=\"text-align:center;margin:30px 0;\">\n<svg width=\"100%\" height=\"120\" viewBox=\"0 0 480 120\" xmlns=\"http://www.w3.org/2000/svg\" style=\"max-width:480px;\">\n  <rect x=\"10\" y=\"35\" width=\"90\" height=\"50\" rx=\"8\" fill=\"#4a90d9\"/>\n  <text x=\"55\" y=\"66\" text-anchor=\"middle\" font-size=\"13\" fill=\"#fff\" font-weight=\"bold\">同性性行为</text>\n  <text x=\"115\" y=\"62\" font-size=\"22\" fill=\"#999\">→</text>\n  <rect x=\"130\" y=\"35\" width=\"90\" height=\"50\" rx=\"8\" fill=\"#4a90d9\"/>\n  <text x=\"175\" y=\"66\" text-anchor=\"middle\" font-size=\"13\" fill=\"#fff\" font-weight=\"bold\">联盟强化</text>\n  <text x=\"235\" y=\"62\" font-size=\"22\" fill=\"#999\">→</text>\n  <rect x=\"250\" y=\"35\" width=\"90\" height=\"50\" rx=\"8\" fill=\"#4a90d9\"/>\n  <text x=\"295\" y=\"66\" text-anchor=\"middle\" font-size=\"13\" fill=\"#fff\" font-weight=\"bold\">地位提升</text>\n  <text x=\"355\" y=\"62\" font-size=\"22\" fill=\"#999\">→</text>\n  <rect x=\"370\" y=\"35\" width=\"100\" height=\"50\" rx=\"8\" fill=\"#e07a5f\"/>\n  <text x=\"420\" y=\"66\" text-anchor=\"middle\" font-size=\"13\" fill=\"#fff\" font-weight=\"bold\">后代更多</text>\n</svg>\n</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">研究者的原话是：</p>\n\n<blockquote style=\"margin:20px 0;padding:14px 18px;background:#f9f9f9;border-left:4px solid #0a84ff;font-size:15px;color:#555;line-height:1.8;\">\"他们一起打架，一起发生性行为，可能正因为这样，他们在群体里获得了优势，能接触更多雌性，最终生更多后代。\"</blockquote>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">所以，同性性行为非但没有降低繁殖成功率，反而通过社会联盟间接提高了繁殖成功率。</p>\n\n<p style=\"text-align:center;font-size:18px;font-weight:bold;color:#2b2b2b;line-height:1.6;margin:30px 0;padding:0 20px;\">自然选择没有淘汰它——因为从整体适应性来看，它是有利的。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">06</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">6.4% 意味着什么</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">这项研究还有一个重要发现：</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">同性性行为在这些恒河猴中是可遗传的，遗传率约为 <strong style=\"color:#0a84ff;font-size:18px;\">6.4%</strong>。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">6.4% 听起来不高，但它说明这种行为有一定的遗传基础，理论上可以通过自然选择演化。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">行为性状的遗传率本来就比形态特征低得多——身高的遗传率可能到 80%，但行为受环境影响大，遗传率往往只有个位数。6.4% 在行为遗传学里，已经算是能检测到的水平了。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">而且研究还发现：同性爬跨中\"主动方\"和\"被动方\"之间存在正遗传相关。这说明不同形式的同性性行为可能有共同的遗传基础，不是完全独立的行为特征。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">如果一种行为既有遗传基础，又能提高繁殖成功率，那按照演化逻辑，它就会在种群里保留下来。</p>\n\n<p style=\"text-align:center;font-size:52px;font-weight:900;color:#1a1a1a;letter-spacing:3px;line-height:1;margin:50px 0 0;\">07</p>\n<p style=\"text-align:center;font-size:21px;font-weight:bold;color:#333;margin:10px 0 26px;\">边界</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">讲完了发现，得说清楚边界。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\"><strong>第一</strong>，这是恒河猴的研究，不是人类研究。动物行为的发现不能直接套用到人类身上，人类的社会结构、文化、制度远比恒河猴复杂。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\"><strong>第二</strong>，这是一个团队的一篇论文（Clive et al., Nature Ecology & Evolution, 2023），结论需要更多独立研究来验证。科学不是一篇论文定终身。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\"><strong>第三</strong>，研究说的是\"同性性行为与更多后代相关\"，这是相关性，不是因果性。虽然研究者排除了年龄、群体结构等混淆因素，但严格的因果链条还需要更多证据。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">猴子岛的故事讲到这里，一个问题自然冒了出来——</p>\n\n<p style=\"text-align:center;font-size:18px;font-weight:bold;color:#2b2b2b;line-height:1.6;margin:30px 0;padding:0 20px;\">这只是恒河猴的特例，还是灵长类的普遍现象？</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">2023 年另一项发表在 Nature Communications 上的研究显示，同性性行为在哺乳动物中广泛存在，已在超过 1500 个物种中被记录到。</p>\n\n<p style=\"font-size:16px;color:#2b2b2b;line-height:1.8;margin:0 0 20px;\">但\"广泛存在\"和\"演化机制\"是两回事。猴子岛的研究，是第一次把\"同性性行为—联盟—繁殖成功\"这条链条，用长期野外数据和基因谱系拼起来。</p>\n\n<p style=\"background:#f0f4f8;border-left:4px solid #0a84ff;padding:14px 18px;margin:30px 0;font-size:15px;color:#444;line-height:1.8;\">自然选择从来不道德。它只看一件事：你的基因能不能传下去。有时候，通向更多后代的路，并不是你以为的那条。</p>\n\n<p style=\"font-size:14px;color:#999;line-height:1.7;margin:40px 0 0;\">参考来源：</p>\n<p style=\"font-size:13px;color:#999;line-height:1.7;margin:0;\">1. Clive, J., Flintham, E. &amp; Savolainen, V. Same-sex sociosexual behaviour is widespread and heritable in male rhesus macaques. <em>Nat Ecol Evol</em> 7, 1287–1301 (2023).</p>\n<p style=\"font-size:13px;color:#999;line-height:1.7;margin:0;\">2. Gómez, J.M., Gónzalez-Megías, A. &amp; Verdú, M. The evolution of same-sex sexual behaviour in mammals. <em>Nat Commun</em> 14, 5719 (2023).</p>\n"
}
</script>

<main class="wx-article">

  <!-- 头部：标题 + 元信息 -->
  <header class="wx-header">
    <h1 class="wx-title" id="postTitle"></h1>
    <div class="wx-meta" id="postMeta"></div>
  </header>

  <!-- 顶部提示条（复制/导出说明） -->
  <div class="wx-notice" role="note">
    <span>以下为公众号预览，可以复制粘贴到公众号后台。或者要求导出 doc 文档后，导入公众号后台。</span>
  </div>

  <!-- 正文 -->
  <article class="wx-body" id="postBody"></article>

  <!-- 底部作者卡 + 互动栏 -->
  <footer class="wx-footer">
    <div class="wx-footer-left">
      <span class="wx-avatar" id="footerAvatar"><svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"></rect><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"></path><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"></path><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"></path><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"></stop><stop offset="1" stop-color="#efefef"></stop></linearGradient></defs></svg></span>
      <span class="wx-footer-name" id="footerName">TraeWork</span>
      <span class="wx-verified" title="认证">✓</span>
      <button class="wx-copy-btn" id="copyBtn" type="button" title="一键复制正文，可直接粘贴至公众号后台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        <span class="label">一键复制</span>
      </button>
    </div>

  </footer>

</main>

<script>
  // Trae Work 品牌头像（与 rednote-post skill 同一枚 SVG）
  const AVATAR_SVG = '<svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg"><rect width="36" height="36" fill="url(#ag)"/><path d="M28.9057 13.3263V10.2109H7.09806V22.6739H10.2121V25.7879H25.7904H28.9057V22.6725V13.3249V13.3263ZM25.7904 22.6739H10.2121V13.3263H25.7904V22.6739Z" fill="#111"/><path d="M15.7985 15.75L13.5957 17.9528L15.7985 20.1556L18.0014 17.9528L15.7985 15.75Z" fill="#111"/><path d="M22.029 15.748L19.8262 17.9509L22.029 20.1537L24.2318 17.9509L22.029 15.748Z" fill="#111"/><defs><linearGradient id="ag" x1="18" y1="0" x2="18" y2="36" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#efefef"/></linearGradient></defs></svg>';

  const DATA = JSON.parse(document.getElementById('post-data').textContent);

  // 标题
  document.getElementById('postTitle').textContent = DATA.title || '';

  // 元信息：原创 · 公众号名 · 作者 · 时间 · 地点
  const meta = document.getElementById('postMeta');
  const parts = [];
  if (DATA.is_original !== false) parts.push('<span class="wx-badge">原创</span>');
  if (DATA.account_sub && DATA.account_sub !== DATA.account) parts.push('<span>' + escapeHtml(DATA.account_sub) + '</span>');
  if (DATA.account)     parts.push('<span class="wx-account">' + escapeHtml(DATA.account) + '</span>');
  if (DATA.date)        parts.push('<span>' + escapeHtml(DATA.date) + '</span>');
  if (DATA.location)    parts.push('<span>' + escapeHtml(DATA.location) + '</span>');
  meta.innerHTML = parts.join('');

  // 正文（body_html 已经是 HTML 片段）
  document.getElementById('postBody').innerHTML = DATA.body_html || '';

  // 底部作者卡
  document.getElementById('footerAvatar').innerHTML = AVATAR_SVG;
  document.getElementById('footerName').textContent = DATA.account || 'TraeWork';

  // 一键复制：把正文（含格式）复制到剪贴板，可粘贴至公众号后台
  const copyBtn = document.getElementById('copyBtn');
  if (copyBtn) {
    copyBtn.addEventListener('click', async () => {
      const bodyEl = document.getElementById('postBody');
      // 直接用原始 body_html，不经过浏览器 DOM 规范化，不额外包 h1
      // 公众号后台标题是单独填的字段，正文里不应再重复标题
      const html = DATA.body_html || (bodyEl ? bodyEl.innerHTML : '');
      // 纯文本 fallback
      const text = bodyEl ? bodyEl.innerText : '';
      let ok = false;
      try {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], {type:'text/html'}),
              'text/plain': new Blob([text], {type:'text/plain'})
            })
          ]);
          ok = true;
        }
      } catch (e) { ok = false; }
      if (!ok) {
        // 兜底：创建临时隐藏容器，注入原始 HTML，再通过 execCommand 复制
        // 这样保证复制的是原始 HTML 而非浏览器可能已改动过的 DOM
        try {
          const tmp = document.createElement('div');
          tmp.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0;';
          tmp.innerHTML = html;
          document.body.appendChild(tmp);
          const range = document.createRange();
          range.selectNodeContents(tmp);
          const sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
          ok = document.execCommand('copy');
          sel.removeAllRanges();
          document.body.removeChild(tmp);
        } catch (e) { ok = false; }
      }
      const label = copyBtn.querySelector('.label');
      const original = label ? label.textContent : '';
      copyBtn.classList.add('is-done');
      if (label) label.textContent = ok ? '已复制' : '复制失败';
      setTimeout(() => {
        copyBtn.classList.remove('is-done');
        if (label) label.textContent = original || '一键复制';
      }, 1600);
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
</script>
